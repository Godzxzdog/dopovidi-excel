<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доповідь про влучання</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="summary.css">
<link rel="stylesheet" href="form.css">
</head>
<body>
<main>
  <form id="f" class="form" autocomplete="off">

    <fieldset>
      <legend>1. Період</legend>
      <div class="grid-4">
        <label>З (час) *<input name="from_time" placeholder="10:14" required></label>
        <label>З (дата) *<input name="from_date" placeholder="02 листопада 2026 року" required></label>
        <label>До (час) *<input name="to_time" placeholder="11:20" required></label>
        <label>До (дата) *<input name="to_date" placeholder="02 листопада 2026 року" required></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>2. Обʼєкт</legend>
      <label>Назва обʼєкту *<input name="object" placeholder='н.п.Гуменне Електрична підстанція ПС 750 кВ “Вінниця”' required></label>
      <label class="mt">Уточнення (район, область, перелік ОКІ)
        <input name="object_note" placeholder="(н.п.Гуменне, Вінницький район, Вінницька область, входить до Переліку ОКІ)">
      </label>
    </fieldset>

    <fieldset>
      <legend>3. Ціль</legend>
      <div class="grid-2">
        <label>Спрямовано БпЛА *<input name="target_count" type="number" min="0" value="1" required></label>
        <label>Опис цілі *<input name="target_desc" placeholder="Ціль 8201, “Герань-4”/Шахед-136/реактивний" required></label>
      </div>
      <label class="mt">Район пуску
        <input name="launch_area" placeholder="невідомо" value="невідомо">
      </label>
    </fieldset>

    <fieldset>
      <legend>4. Параметри польоту</legend>
      <div class="grid-2">
        <label>Висота польоту *<input name="altitude" placeholder="до 4500-3000 м" required></label>
        <label>Швидкість польоту *<input name="speed" placeholder="до 325 км/год" required></label>
      </div>
      <label class="mt">Метеорологічні умови *
        <textarea name="weather" rows="3" required
          placeholder="Хмарність 6-9 балів верхня, середня, шарувато-купчаста. Нижня межа 300-500 м. Верхня межа 2-3 км. Серпанок. Видимість 6-10 км. Вітер 310-330° 3-6 м/с. Температура +5 ~ +10 °С."></textarea>
      </label>
      <label class="mt">Атака обʼєкту здійснювалась *
        <input name="attack_dir" placeholder="з Пд-Сх напрямку" required>
      </label>
    </fieldset>

    <fieldset>
      <legend>5. Результат знищення</legend>
      <div class="grid-2">
        <label>Знищено/подавлено — БпЛА *<input name="destroyed" type="number" min="0" value="0" required></label>
        <label>Локаційно втрачених — БпЛА *<input name="lost" type="number" min="0" value="0" required></label>
      </div>
      <div class="grid-3 mt">
        <label>БпЛА-перехоплювачів *<input name="interceptors" type="number" min="0" value="0" required></label>
        <label>Застосувань МВГ *<input name="mvg" type="number" min="0" value="0" required></label>
        <label>Переміщень МВГ<input name="mvg_moves" type="number" min="0" value="0"></label>
      </div>
      <div class="grid-3 mt">
        <label>РЛВ<input name="rlv" type="number" min="0" value="0"></label>
        <label>Тактична авіація<input name="aviation" type="number" min="0" value="0"></label>
        <label>Застосувань ПЗРК<input name="manpads" type="number" min="0" value="0"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>6. До протиповітряного прикриття обʼєкта було залучено *</legend>
      <div id="forces" class="rows"></div>
      <button type="button" class="ghost small" data-add="forces">+ додати рядок</button>
    </fieldset>

    <fieldset>
      <legend>7. Влучання, падіння уламків</legend>
      <div class="grid-2">
        <label>Кількість БпЛА<input name="hits" type="number" min="0" value="0"></label>
        <label>Формулювання рядка
          <select name="hits_label">
            <option value="Влучання, Падіння уламків">Влучання, Падіння уламків</option>
            <option value="Влучання">Влучання</option>
            <option value="Падіння уламків">Падіння уламків</option>
          </select>
        </label>
      </div>
      <label class="mt">Що саме сталося
        <textarea name="hits_text" rows="3"
          placeholder="10:14 влучання БпЛА (реактивний БпЛА). Було влучання на території ПС 750 «Вінницька», попередньо в вагончик будівельників, ОКІ працює в штатному режимі."></textarea>
      </label>
    </fieldset>

    <fieldset>
      <legend>8. Причини, що ускладнювали знищення *</legend>
      <textarea name="causes" rows="3" required
        placeholder="Складні погодні умови не дозволили розрахункам ВГ, МВГ своєчасно виявити та здійснити обстріли швидкісної цілі."></textarea>
    </fieldset>

    <fieldset>
      <legend>9. Прийняті рішення *</legend>
      <textarea name="decisions" rows="3" required
        placeholder="Здійснити перерозподіл сил та засобів згідно аналіз прольоту цілей"></textarea>
    </fieldset>

    <div class="row sticky-row">
      <button type="button" id="build">Сформувати</button>
      <button type="button" class="ghost" id="copy">Копіювати</button>
      <button type="button" class="ghost" id="dl">Завантажити .txt</button>
      <button type="reset" class="ghost" id="reset">Очистити</button>
      <span class="status" id="status" role="status"></span>
    </div>
  </form>

  <h2 class="out-title">Готова доповідь</h2>
  <pre id="out" class="report"></pre>
</main>

<script src="hit.js"></script>
<script src="shell.js"></script>
<script>initShell({ active: 'hit' });</script>
</body>
</html>
