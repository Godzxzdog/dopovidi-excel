<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Доповідь про влучання</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="shell.css">
<link rel="stylesheet" href="summary.css">
<link rel="stylesheet" href="form.css">
</head>
<body>
<main>
  <form id="f" class="form" autocomplete="off">

    <fieldset>
      <legend>1. Період</legend>
      <div class="grid-4">
        <label>З (час) *<input name="from_time" placeholder="00:00" required></label>
        <div class="dateline">
          <span class="dl-label">З (дата) *</span>
          <select name="from_day" required><option value="">дд</option><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option></select>
          <select name="from_month" required><option value="">місяць</option><option value="1">січня</option><option value="2">лютого</option><option value="3">березня</option><option value="4">квітня</option><option value="5">травня</option><option value="6">червня</option><option value="7">липня</option><option value="8">серпня</option><option value="9">вересня</option><option value="10">жовтня</option><option value="11">листопада</option><option value="12">грудня</option></select>
          <select name="from_year" required><option value="">рррр</option><option>2025</option><option>2026</option><option>2027</option></select>
          <span class="dl-suffix">року</span>
        </div>
        <label>До (час) *<input name="to_time" placeholder="00:00" required></label>
        <div class="dateline">
          <span class="dl-label">До (дата) *</span>
          <select name="to_day" required><option value="">дд</option><option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option><option value="13">13</option><option value="14">14</option><option value="15">15</option><option value="16">16</option><option value="17">17</option><option value="18">18</option><option value="19">19</option><option value="20">20</option><option value="21">21</option><option value="22">22</option><option value="23">23</option><option value="24">24</option><option value="25">25</option><option value="26">26</option><option value="27">27</option><option value="28">28</option><option value="29">29</option><option value="30">30</option><option value="31">31</option></select>
          <select name="to_month" required><option value="">місяць</option><option value="1">січня</option><option value="2">лютого</option><option value="3">березня</option><option value="4">квітня</option><option value="5">травня</option><option value="6">червня</option><option value="7">липня</option><option value="8">серпня</option><option value="9">вересня</option><option value="10">жовтня</option><option value="11">листопада</option><option value="12">грудня</option></select>
          <select name="to_year" required><option value="">рррр</option><option>2025</option><option>2026</option><option>2027</option></select>
          <span class="dl-suffix">року</span>
        </div>
      </div>
    </fieldset>

    <fieldset>
      <legend>2. Обʼєкт</legend>
      <label>Назва обʼєкту *<input name="object" placeholder="Назва об’єкта" required></label>
      <label class="mt">Уточнення (район, область, перелік ОКІ)
        <input name="object_note" placeholder="Район, область, перелік ОКІ">
      </label>
    </fieldset>

    <fieldset>
      <legend>3. Ціль</legend>
      <div class="grid-2">
        <label>Спрямовано БпЛА *<input name="target_count" type="number" min="0" value="1" required></label>
        <div>
          <label>Тип цілі *</label>
          <select name="target_type" required>
            <option value="">оберіть тип</option>
              <option value="Герань">Герань</option>
              <option value="Герань (реактивний)">Герань (реактивний)</option>
              <option value="Гербера">Гербера</option>
              <option value="Пародія">Пародія</option>
              <option value="Ланцет">Ланцет</option>
              <option value="Бандероль">Бандероль</option>
              <option value="Шахед-136">Шахед-136</option>
              <option value="Шахед-131">Шахед-131</option>
              <option value="Крилата ракета">Крилата ракета</option>
              <option value="Невідомий">Невідомий</option>
          </select>
        </div>
        <div>
          <label>Номер цілі</label>
          <input name="target_no" placeholder="номер">
        </div>
      </div>
      <label class="mt">Район пуску
        <input name="launch_area" placeholder="невідомо" value="невідомо">
      </label>
    </fieldset>

    <fieldset>
      <legend>4. Параметри польоту</legend>
      <div class="grid-2">
        <label>Висота польоту *<input name="altitude" placeholder="до ____ м" required></label>
        <label>Швидкість польоту *<input name="speed" placeholder="до ____ км/год" required></label>
      </div>
      <label class="mt">Метеорологічні умови *
        <textarea name="weather" rows="3" required
          placeholder="Хмарність, видимість, вітер, температура"></textarea>
      </label>
      <label class="mt">Атака обʼєкту здійснювалась *
        <input name="attack_dir" placeholder="напрямок" required>
      </label>
    </fieldset>

    <fieldset>
      <legend>5. Результат знищення</legend>
      <div class="grid-2">
        <label>Знищено/подавлено — БпЛА *<input name="destroyed" type="number" min="0" value="0" required></label>
        <label>Локаційно втрачених — БпЛА *<input name="lost" type="number" min="0" value="0" required></label>
      </div>
      <div class="grid-3 mt">
        <label>БпЛА-перехоплювачів *<input name="interceptors" type="number" min="0" value="0" required></label>
        <label>Застосувань МВГ *<input name="mvg" type="number" min="0" value="0" required></label>
        <label>Переміщень МВГ<input name="mvg_moves" type="number" min="0" value="0"></label>
      </div>
      <div class="grid-3 mt">
        <label>РЛВ<input name="rlv" type="number" min="0" value="0"></label>
        <label>Тактична авіація<input name="aviation" type="number" min="0" value="0"></label>
        <label>Застосувань ПЗРК<input name="manpads" type="number" min="0" value="0"></label>
      </div>
    </fieldset>

    <fieldset>
      <legend>6. До протиповітряного прикриття обʼєкта було залучено *</legend>
      <div id="forces" class="rows"></div>
      <button type="button" class="ghost small" data-add="forces">+ додати рядок</button>
    </fieldset>

    <fieldset>
      <legend>7. Влучання, падіння уламків</legend>
      <div class="grid-2">
        <label>Кількість БпЛА<input name="hits" type="number" min="0" value="0"></label>
        <label>Формулювання рядка
          <select name="hits_label">
            <option value="Влучання, Падіння уламків">Влучання, Падіння уламків</option>
            <option value="Влучання">Влучання</option>
            <option value="Падіння уламків">Падіння уламків</option>
          </select>
        </label>
      </div>
      <label class="mt">Що саме сталося
        <textarea name="hits_text" rows="3"
          placeholder="Час, що сталося, наслідки"></textarea>
      </label>
    </fieldset>

    <fieldset>
      <legend>8. Причини, що ускладнювали знищення *</legend>
      <textarea name="causes" rows="3" required
        placeholder="Що завадило знищити ціль"></textarea>
    </fieldset>

    <fieldset>
      <legend>9. Прийняті рішення *</legend>
      <textarea name="decisions" rows="3" required
        placeholder="Які рішення прийнято"></textarea>
    </fieldset>

    <div class="row sticky-row">
      <button type="button" id="build">Сформувати</button>
      <button type="button" class="ghost" id="copy">Копіювати</button>
      <button type="button" class="ghost" id="dl">Завантажити .txt</button>
      <button type="reset" class="ghost" id="reset">Очистити</button>
      <span class="status" id="status" role="status"></span>
    </div>
  </form>

  <h2 class="out-title">Готова доповідь</h2>
  <pre id="out" class="report"></pre>
</main>

<script src="hit.js"></script>
<script src="shell.js"></script>
<script>initShell({ active: 'hit' });</script>
</body>
</html>
